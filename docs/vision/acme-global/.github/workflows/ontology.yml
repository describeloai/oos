name: Ontology CI

on:
  pull_request:
  push: { branches: [main] }
  schedule:
    - cron: '0 2 * * *'          # drift nocturno

jobs:
  # ── Hermético: sin red, sin credenciales, determinista ─────────────────────────
  # Nueve de los catorce comandos de ORE no abren un socket. El paso que decide
  # qué significan las cosas es el único que no puede filtrar nada.
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: acme/setup-ore@v1
        with: { version: '0.9.1' }

      - run: ore validate            # ¿cumple OOS?
      - run: ore lint                # ¿consistentes reglas, SHACL y tipados?
      - run: ore test                # ¿pasan inferencia, temporalidad y POLÍTICAS?

      # El momento que vende. Un PR que redefine "cliente activo" recibe:
      # "esto rompe 3 consumidores, 2 reglas de inferencia y 1 política de acceso".
      - run: ore diff --breaking --base origin/main
        id: semantic-diff

      - run: ore plan                # delta semántico antes de aplicar

      - run: ore compile --sign --output dist/
      - run: ore attest dist/bundle.oob      # cosign / Sigstore

      # La plataforma recibe el VEREDICTO y el DIGEST. Nunca la fuente.
      # "Tu ontología nunca sale de tu CI" cierra objeciones en vez de abrirlas.
      - run: ore report --to $ORE_PLATFORM_URL --digest-only
        if: github.event_name == 'pull_request'
        env:
          ORE_PLATFORM_URL: ${{ vars.ORE_PLATFORM_URL }}

  # ── Con red: el único job que toca fuentes de producción ──────────────────────
  drift:
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, vpc]     # runner dentro de la VPC del cliente
    steps:
      - uses: actions/checkout@v4
      - uses: acme/setup-ore@v1

      # Si el DBA renombró una columna, esto abre un PR con el YAML sugerido.
      # La deriva de esquema deja de ser un incidente silencioso en producción y
      # pasa a ser un diff con autor, revisor y fecha.
      - run: ore drift-detect --auto-pr --label schema-drift
        env:
          ERP_DATABASE_URL:   ${{ secrets.ERP_DATABASE_URL }}
          SNOWFLAKE_SCM_URL:  ${{ secrets.SNOWFLAKE_SCM_URL }}
          SALESFORCE_CRM_URL: ${{ secrets.SALESFORCE_CRM_URL }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}

  # ── Vista previa: un ORE por rama ─────────────────────────────────────────────
  # Lo que Vercel hizo con el front-end, aplicado al significado. Un responsable
  # de negocio compara la salida real de dos definiciones antes de decidir cuál
  # se mergea. Ninguna herramienta de ontología del mercado puede hacer esto.
  preview:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, vpc]
    steps:
      - uses: actions/checkout@v4
      - uses: acme/deploy-ore-preview@v1
        with:
          name: pr-${{ github.event.number }}
          expose: [DRAFT, REVIEWED, STABLE]   # en preview sí se ven los borradores
