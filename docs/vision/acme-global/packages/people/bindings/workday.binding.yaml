# GENERATED BY ORE CLI v0.9.1 — curado por @acme/hr-domain
apiVersion: oos.dev/v1alpha1
kind: Binding

metadata:
  name: workday_hr_binding
  namespace: people
  status: STABLE

spec:
  datasourceRef: workday_hr

  # ── Materialización ─────────────────────────────────────────────────────────
  # passthrough: no se almacena NADA localmente. Ni valores, ni topología.
  # Cada lectura va contra Workday y pasa por CompensationAccess.
  #
  # Subir esto a `cache` sobre propiedades marcadas PII produce un ERROR DE
  # COMPILACIÓN, no una advertencia — ver strict.piiMaterialization en el
  # manifiesto raíz. Y aunque no lo produjera, el cambio se ve en el diff de un
  # pull request que @acme/security tiene que aprobar por CODEOWNERS.
  #
  # Qué se copia es, en sí mismo, Ontology-as-Code.
  materialization:
    mode: passthrough

  entities:
    - targetEntity: people.Employee
      mapping:
        sourceObject: "Worker"
        columns:
          id:            "worker_wid"
          fullName:      "legal_name_full"
          workEmail:     "primary_work_email"
          nationalId:    "national_id_number"
          country:       "location_country_code"
          department:    "supervisory_org_name"
          positionTitle: "business_title"
          hireDate:      "original_hire_date"
          validFrom:     "effective_date"
          validTo:       "effective_end_date"
          recordedAt:    "entry_moment"        # el eje systemTime de Workday

    - targetEntity: people.CompensationRecord
      mapping:
        sourceObject: "Compensation_Plan_Assignment"
        columns:
          id:            "assignment_wid"
          employeeId:    "worker_wid"
          baseSalary:    "amount"
          currency:      "currency_code"
          bonusTarget:   "target_bonus_amount"
          effectiveFrom: "effective_date"
          effectiveTo:   "effective_end_date"
          recordedAt:    "entry_moment"
          changeReason:  "reason_code"

# ── Perfilado ─────────────────────────────────────────────────────────────────
# `ore discover --profile` sobre esta fuente recoge únicamente ratio de nulos y
# cardinalidad. Nunca min/max, histogramas ni muestras: un min/max sobre
# `amount` ES un dato salarial, y "solo recogemos estadísticas" no sobrevive a
# un auditor.
