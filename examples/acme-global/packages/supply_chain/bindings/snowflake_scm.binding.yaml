# GENERATED BY ORE CLI v0.9.1 [DRAFT] — curado por @acme/scm-domain
apiVersion: oos/v1alpha1
kind: Binding

metadata:
  name: snowflake_scm_binding
  namespace: supply_chain
  status: STABLE

spec:
  datasourceRef: snowflake_scm

  # ── mode: index ─────────────────────────────────────────────────────────────
  # FCT_SHIPMENT tiene ~800M de filas y crece 2M al día. No se copia ninguna.
  #
  # Lo que se materializa son las aristas: (shipment → supplier),
  # (supplier → product), (order → product). Del orden de decenas de bytes por
  # arista: ~40 GB de topología describiendo varios petabytes de carga útil.
  #
  # Resultado: recorrer el grafo es local y sub-milisegundo; leer el valor
  # declarado de un envío concreto sigue yendo a Snowflake y sigue pasando por
  # política. Cero copia de carga útil, velocidad de grafo nativo.
  materialization:
    mode: index
    refresh: { every: 5m, strategy: incremental }
    watermark: LAST_UPDATED_TS
    indexes:
      - { relation: supply_chain.shippedBy,   direction: both }
      - { relation: supply_chain.supplies,    direction: both }
      - { relation: supply_chain.orderedFrom, direction: both }
    estimatedEdges: 1.2e9
    residency: eu-west-1          # el índice no sale de la región de la fuente

  entities:
    - targetEntity: supply_chain.Shipment
      mapping:
        sourceTable: "SCM.PUBLIC.FCT_SHIPMENT"
        columns:
          id:              "SHIPMENT_ID"
          supplierId:      "SUPPLIER_SK"
          destinationSite: "DEST_SITE_CODE"
          carrier:         "CARRIER_NAME"
          status:          "STATUS_CD"
          promisedDate:    "PROMISED_DT"
          actualDate:      "ACTUAL_DELIVERY_DT"
          declaredValue:   "DECLARED_VALUE_AMT"
          currency:        "DECLARED_VALUE_CCY"
          originCountry:   "ORIGIN_CTRY_ISO2"
          lastUpdatedAt:   "LAST_UPDATED_TS"
      pushdown:
        filters: true             # los WHERE bajan a Snowflake
        aggregates: true          # los COUNT/SUM también
        joins: within-datasource  # los joins entre fuentes los resuelve el índice

    - targetEntity: supply_chain.Supplier
      mapping:
        sourceTable: "SCM.PUBLIC.DIM_SUPPLIER"
        columns:
          id:             "SUPPLIER_SK"
          legalName:      "SUPPLIER_NAME"
          taxId:          "TAX_IDENTIFIER"
          country:        "CTRY_ISO2"
          tier:           "TIER_LEVEL"
          certifications: "CERT_CODES"      # array delimitado, normalizado en compilación
          validFrom:      "SCD_VALID_FROM"  # la fuente ya es SCD2: se mapea a validTime
          validTo:        "SCD_VALID_TO"
          recordedAt:     "DW_LOAD_TS"      # y DW_LOAD_TS es el eje systemTime
