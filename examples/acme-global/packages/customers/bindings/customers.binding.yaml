apiVersion: oos/v1alpha1
kind: Binding

metadata:
  name: customers_multi_source
  namespace: customers
  status: STABLE

spec:
  # ── Materialización: mode `index` ────────────────────────────────────────────
  # Se copian las CLAVES DE JOIN y las ARISTAS. No la carga útil.
  #
  # Sin esto, recorrer Customer → Order → Product son tres joins federados
  # encadenados entre Salesforce, PostgreSQL y Snowflake: lento, y la razón por la
  # que los motores de consulta federada decepcionan en producción.
  #
  # Con esto: la topología es local y sub-milisegundo; los valores siguen viniendo
  # de origen y pasando por política en cada lectura.
  materialization:
    mode: index
    refresh: { every: 15m, strategy: incremental }
    watermark: updated_at          # el segundo eje de la respuesta de auditoría
    indexes:
      - { relation: customers.placedOrder, direction: both }
      - { relation: customers.orderContains, direction: both }

  entities:
    # ── Fuente 1: el CRM ───────────────────────────────────────────────────────
    - targetEntity: customers.Customer
      datasourceRef: salesforce_crm
      mapping:
        sourceObject: "Account"
        columns:
          contactEmail: "PersonEmail"
          segment:      "Customer_Segment__c"
          legalName:    "Name"
          taxId:        "VAT_Number__c"
          country:      "BillingCountryCode"

    # ── Fuente 2: el ERP ───────────────────────────────────────────────────────
    - targetEntity: customers.Customer
      datasourceRef: postgres_erp
      mapping:
        sourceTable: "public.customer"
        columns:
          legalName:  "legal_name"
          taxId:      "tax_id"
          country:    "country_iso"
          createdAt:  "created_at"

    - targetEntity: customers.Order
      datasourceRef: postgres_erp
      mapping:
        sourceTable: "public.sales_order"
        columns:
          id:          "order_uuid"
          customerId:  "customer_id"
          totalAmount: "total_net"
          currency:    "currency_code"
          placedAt:    "order_ts"
          status:      "state_code"      # descubierto como `state_code`, normalizado a `status`
