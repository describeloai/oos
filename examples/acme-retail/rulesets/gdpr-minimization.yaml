apiVersion: oos.dev/v1alpha3
kind: Ruleset
metadata:
  name: gdpr-minimization
  namespace: eu
  description: >
    Las reglas del equipo de cumplimiento sobre lo que el RGPD clasifica.

    Vive en su propio documento, con su propio `owner`, porque quien responde
    del cumplimiento tiene que poder restringir el modelo SIN poder editarlo.
    Con reglas colgando de cada propiedad eso es estructuralmente imposible:
    serían el mismo fichero, el mismo CODEOWNERS y el mismo permiso de
    escritura.

    Y apunta por CLASIFICACIÓN, no por nombre: una propiedad que alguien
    clasifique `high` mañana queda gobernada el mismo día, sin que nadie toque
    este fichero. Es la diferencia entre una regla que se pudre y una que no.
spec:
  owner: team:compliance

  targets:
    - atLeast: { gdpr.sensitivity: high }

  # Los recortes de fila. Cedar gobierna PROPIEDADES —«quien ve la
  # compensacion»—; que filas ve cada quien es otro eje, y se declara aqui
  # porque es gobierno y no fisica: una entidad tiene varios bindings, y una
  # regla repetida por binding diverge en silencio el dia que alguien anade el
  # cuarto.
  #
  # El lado derecho es siempre un ATRIBUTO DEL PRINCIPAL, nunca un literal. Por
  # eso el recorte no filtra nada que el principal no haya traido el mismo: la
  # presencia de una fila solo le revela un valor que ya tenia.
  scopes:
    - id: own-department
      property: hr.Employee.departmentId
      matches: departmentId

    # Un salto por igualdad, que es lo que un filtro sabe hacer. La cadena de
    # mando ENTERA no es un filtro: es una travesia, y la responde el indice de
    # topologia en la fase ② (`05-ejecutor` §6.1).
    - id: direct-reports
      property: hr.Employee.managerId
      matches: employeeId

  assertions:
    - id: sin-nulos
      metric: nullValues
      mustBe: 0
      dimension: completeness
      severity: error
      businessImpact: >
        Un dato personal ausente no se puede rectificar ni borrar a petición
        del interesado: el derecho existe y no hay sobre qué ejercerlo.
