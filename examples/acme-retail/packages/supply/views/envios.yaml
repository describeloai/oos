apiVersion: oos.dev/v1alpha14
kind: View

metadata:
  name: envios
  namespace: supply
  description: >
    Qué se expone de la tabla de envíos, y con qué nombre. Virtual: lo que se
    materializaba aquí eran las ARISTAS del grafo, y eso es derivable — se
    computa, no se declara.

spec:
  owner: team:supply-chain

  # Migrada de v1alpha8 con `ore migrate v1alpha14`: la misma pregunta, escrita
  # como la consulta que siempre fue.
  dialect: duckdb
  sql: |
    SELECT
      "SHP_UUID" AS "shipmentId",
      "FK_SUPPLIER_ID" AS "supplierId",
      "FK_SKU_CODE" AS "skuCode",
      "QTY_UNITS" AS "quantity",
      "DT_PROMISED_UTC" AS "promisedAt",
      "CD_STATUS" AS "status",
      "DT_DELIVERED_UTC" AS "deliveredAt",
      "DT_ROW_VALID_FROM" AS "validFrom",
      "DT_ROW_VALID_TO" AS "validTo"
    FROM "supply"."shipment_v2"

  # El contrato, derivado de la consulta; `String` porque `shipment_v2` no tipa
  # sus columnas.
  columns:
    shipmentId: { type: String }
    supplierId: { type: String }
    skuCode: { type: String }
    quantity: { type: String }
    promisedAt: { type: String }
    status: { type: String }
    deliveredAt: { type: String }
    validFrom: { type: String }
    validTo: { type: String }

  # ---------------------------------------------------------------------
  # Dos cosas que el binding tenía y esto no. Están dichas porque una
  # migración que solo enumera lo que conserva promete que no se pierde nada.
  #
  # 1 · `materialization: { mode: index }`
  #
  #     No se migra, y no es un olvido: el índice de topología es UNA VISTA DE
  #     ARISTAS —la clave primaria y las propiedades `via` de las relaciones— y
  #     lo derivable no se declara (P2). Se sigue materializando; lo que ya no
  #     se escribe es que se materializa.
  #
  # 2 · `delayDays`, calculado por el ORIGEN
  #
  #     El binding traía
  #       delayDays:
  #         expression: "DATEDIFF(day, DT_PROMISED_UTC, COALESCE(...))"
  #     y en v1alpha8 eso no cabía: `fields` renombraba, y nada más
  #     (`00-scope` §5.3). `supply.Shipment.delayDays` sigue siendo una
  #     propiedad DERIVADA: conserva su `derivedFrom`, que es lo que propaga
  #     las etiquetas.
  #
  #     Desde v1alpha14 cabe: la vista es una consulta, y la cuenta sería una
  #     columna más (`date_diff('day', ...) AS "delayDays"`). No se añade al
  #     migrar, porque migrar es mecánico —expone lo mismo que antes—; añadirla
  #     es un cambio de la pregunta, y lo decide su dueño.
  # ---------------------------------------------------------------------
