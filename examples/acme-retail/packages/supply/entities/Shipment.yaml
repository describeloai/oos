apiVersion: oos.dev/v1alpha8
kind: Entity
metadata:
  name: Shipment
  namespace: supply
  # Un dominio entero sin una sola etiqueta sensible, y está aquí a propósito.
  # La mayor parte de una ontología empresarial no es sensible: si un ejemplo
  # solo muestra PII, engaña sobre lo que el sistema pide en la práctica.
  #
  # Nada aquí exige revisión de seguridad, nada bloquea materialización, y
  # todo puede servirse a la superficie global sin desclasificar nada.
  labels:
    oos.maturity:     STABLE
    gdpr.sensitivity: none
    acme.residency:   global

spec:
  nature: entity
  primaryKey: [shipmentId]

  # La vista de la que sale. Nombra una vista y nunca la tabla: si nombrara
  # `shipment_v2`, esta entidad tendría que llamar `SHP_UUID` a su clave.
  backedBy: envios

  temporal:
    validTime: { from: validFrom, to: validTo }

  properties:

    shipmentId:
      type: String
      description: Identificador estable y opaco.

    supplierId:
      type: String
      description: Clave del proveedor. El DATO; la arista está abajo.

    skuCode:
      type: String
      description: Clave de la referencia enviada. El DATO; la arista está abajo.

    quantity:
      type: Integer

    promisedAt:
      type: DateTime

    deliveredAt:
      type: DateTime
      required: false

    # Derivada. join() sobre orígenes sin etiqueta da ⊥ = none, así que no se
    # declara `labels`: se computa (OOS4008).
    #
    # Y desde v1alpha8 es derivada **y nada más**: el binding la traía además
    # calculada por Snowflake con un `expression` físico, y una vista renombra
    # pero no calcula. Lo que se conserva es la procedencia —que es lo que
    # propaga las etiquetas—; lo que se pierde es que el origen la compute.
    # `00-scope` §5.3 lo dice entero.
    delayDays:
      type: Integer
      derivedFrom: [supply.Shipment.promisedAt, supply.Shipment.deliveredAt]
      expression: "days_between(promisedAt, coalesce(deliveredAt, now()))"

    status:
      type: String
      enum: [pending, in_transit, delivered, delayed, cancelled]

  # Las aristas del grafo, separadas de los datos. Son las dos que se
  # materializan como índice: se copian las aristas, no la carga útil — y ya no
  # hace falta declararlo, porque el índice ES una vista de aristas y lo
  # derivable no se declara (P2).
  relations:

    supplier:
      target: supply.Supplier
      cardinality: many_to_one
      via: [supplierId]
      required: true

    sku:
      target: supply.Sku
      cardinality: many_to_one
      via: [skuCode]
      required: true

  moved:
    - { from: eta, to: promisedAt, since: 1.1.0 }
