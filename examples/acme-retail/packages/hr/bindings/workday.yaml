apiVersion: oos.dev/v1alpha1
kind: Binding

metadata:
  name: workday
  namespace: hr
  description: >
    Empleados desde Workday. Sin materialización: la compensación no puede salir
    del origen, y con `passthrough` no hay nada que gobernar aguas abajo.

spec:
  targetEntity: hr.Employee
  datasourceRef: hr_workday

  # Solo el nombre: la versión se resuelve desde `dependencies` y se fija en
  # ontology.lock. El perfil ya mapea los objetos estándar de Workday — sin él,
  # estas veinte líneas serían doscientas.
  profile: oos.dev/connectors/workday

  source: "Worker"

  properties:
    # Forma breve: equivale a `{ column: "..." }`. La canónica es siempre la
    # expandida; el compilador la materializa al normalizar (N2).
    employeeId:   "Worker_Reference.ID"
    fullName:     "Personal_Data.Name_Data.Legal_Name.Full_Name"
    email:        "Contact_Data.Email_Address_Data.Email_Address"
    managerId:    "Management_Chain_Data.Manager_Reference"
    departmentId: "Organization_Data.Cost_Center_Reference"
    grade:        "Compensation_Data.Grade_Reference"

    # Forma expandida cuando hace falta declarar el tipo físico: una propiedad
    # Money<EUR,2> sobre un FLOAT sería un error esperando a ocurrir.
    baseSalary:
      column: "Compensation_Data.Base_Pay.Amount"
      physicalType: "decimal(18,2)"

    bonus:
      column: "Compensation_Data.Bonus_Plan.Target_Amount"
      physicalType: "decimal(18,2)"

    # Derivada en la entidad, pero necesita binding igual que cualquier otra:
    # `derivedFrom` declara PROCEDENCIA para propagar etiquetas, no computación.
    # Aquí el cálculo ya viene hecho de Workday.
    totalCompensation:
      column: "Compensation_Data.Total_Compensation.Amount"
      physicalType: "decimal(18,2)"

    validFrom: "Worker_Status_Data.Hire_Date"
    validTo:   "Worker_Status_Data.Termination_Date"

  # Vienen del perfil de conector; se repiten aquí solo para que el ejemplo se
  # lea completo. Workday es una API con cuota: no admite recorrido completo.
  capabilities:
    predicatePushdown: [eq, in]
    joinPushdown: false
    aggregatePushdown: []
    fullScan: forbidden
    requiredFilters: [employeeId]
    maxRowsPerRequest: 200

  materialization:
    mode: passthrough

  # ---------------------------------------------------------------------
  # Por qué `passthrough` y no `index`.
  #
  #   mode: index  →  error[OOS4002]
  #
  #     hr.Employee.nationalId  ──binding──▶  materialization.index
  #
  #     etiqueta del origen      : gdpr.sensitivity = critical
  #     autorización del conducto: gdpr.sensitivity = medium
  #
  # Se detecta al compilar. Sin conexión a Workday, sin credenciales, sin haber
  # leído el registro de un solo empleado.
  # ---------------------------------------------------------------------
