apiVersion: oos.dev/v1alpha14
kind: View

metadata:
  name: empleados
  namespace: hr
  description: >
    Qué se expone del `Worker` de Workday, y con qué nombre. Sin materializar:
    la compensación no puede salir del origen, y una vista virtual no copia
    nada, así que no hay nada que gobernar aguas abajo.

spec:
  # La vista tiene dueño y la tabla no. No es un detalle de forma: la tabla es
  # un hecho del origen y no la decide nadie; qué se expone y con qué frescura
  # sí, y alguien responde de ello.
  owner: team:people-data

  # Migrada de v1alpha8 con `ore migrate v1alpha14`: la misma pregunta, escrita
  # como la consulta que siempre fue (`from` es el FROM, `fields` el SELECT).
  dialect: duckdb
  sql: |
    SELECT
      "Worker_Reference.ID" AS "employeeId",
      "Personal_Data.Name_Data.Legal_Name.Full_Name" AS "fullName",
      "Contact_Data.Email_Address_Data.Email_Address" AS "email",
      "Personal_Data.National_ID" AS "nationalId",
      "Management_Chain_Data.Manager_Reference" AS "managerId",
      "Organization_Data.Cost_Center_Reference" AS "departmentId",
      "Compensation_Data.Grade_Reference" AS "grade",
      "Compensation_Data.Base_Pay.Amount" AS "baseSalary",
      "Compensation_Data.Bonus_Plan.Target_Amount" AS "bonus",
      "Compensation_Data.Total_Compensation.Amount" AS "totalCompensation",
      "Worker_Status_Data.Hire_Date" AS "validFrom",
      "Worker_Status_Data.Termination_Date" AS "validTo"
    FROM "hr"."workday_worker"

  # El contrato, derivado de la consulta. `String` porque `workday_worker` no
  # tipa sus columnas: es lo único que se afirma de ellas. La entidad afina
  # encima (`Money<EUR, 2>`), y eso es de la entidad, no de la columna.
  columns:
    employeeId: { type: String }
    fullName: { type: String }
    email: { type: String }
    nationalId: { type: String }
    managerId: { type: String }
    departmentId: { type: String }
    grade: { type: String }
    baseSalary: { type: String }
    bonus: { type: String }
    totalCompensation: { type: String }
    validFrom: { type: String }
    validTo: { type: String }

  # ---------------------------------------------------------------------
  # Por qué ningún `Dataset` la copia, y las DOS formas en que fallaría.
  #
  #   kind: Dataset · from: { view: hr.empleados }  →  error[OOS4011]
  #
  #     Este repositorio declara `materialization.index` y
  #     `materialization.cache`, y NO declara `materialization.payload`. Un
  #     conducto que no se lista tiene autorización ⊥ (P4): omitirlo no es
  #     dejarlo abierto, es cerrarlo.
  #
  # Y si alguien lo declarara al nivel de los otros dos:
  #
  #   materialization.payload: { gdpr.sensitivity: medium }  →  error[OOS4002]
  #
  #     hr.Employee.baseSalary  ──vista──▶  materialization.payload
  #
  #     etiqueta de la entidad   : gdpr.sensitivity = critical
  #     autorización del conducto: gdpr.sensitivity = medium
  #
  #     La etiqueta la puso la ENTIDAD, dos capas más arriba, y baja hasta aquí
  #     por la columna del contrato. Esta vista no lleva significado y aun así
  #     no puede copiarse: es el sello de v1alpha7 §5.2, intacto con una
  #     consulta en vez de una forma.
  #
  #     Y no es un campo: son ONCE. `baseSalary` sale el primero por orden
  #     alfabético, y entre los once está `nationalId` — que es exactamente el
  #     campo con el que el binding original enseñaba esto, cuando ni siquiera
  #     lo mapeaba. Ahora lo mapea, y la traza es cierta en vez de hipotética.
  #
  # Las dos se detectan al compilar: sin conexión a Workday, sin credenciales,
  # sin haber leído el registro de un solo empleado.
  #
  # Y hay un tercer motivo, que desde v1alpha8 se sabe decir: `workday_worker`
  # declara `changes: { mode: none }`. Copiar algo que no emite cambios se
  # puede, pero no se puede REFRESCAR sin volver a leerlo entero — y `ore view`
  # lo dice antes de que nadie lo intente.
  # ---------------------------------------------------------------------
