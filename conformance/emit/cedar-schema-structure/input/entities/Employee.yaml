apiVersion: oos.dev/v1alpha1
kind: Entity
metadata: { name: Employee, namespace: hr }
spec:
  nature: entity
  # Quien pregunta ES una entidad del modelo: sin esto el principal seria
  # `Role`, una bolsa opaca, y la jerarquia emitida no la podria usar nadie.
  principal: true
  primaryKey: [employeeId]
  properties:
    employeeId: { type: String }
    managerId:  { type: String }
    baseSalary: { type: "Money<EUR, 2>", labels: { gdpr.sensitivity: high } }
  relations:
    manager:
      target: hr.Employee
      cardinality: many_to_one
      via: [managerId]
