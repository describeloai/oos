apiVersion: oos.dev/v1alpha1
kind: Entity
metadata: { name: Employee, namespace: hr }
spec:
  nature: entity
  primaryKey: [employeeId]
  properties:
    employeeId: { type: String }
    baseSalary:
      type: Money<EUR, 2>
      examples:
        # Número JSON. Debería ser cadena: "68400.50"
        values: [68400.50]
        synthetic: true
