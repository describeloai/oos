apiVersion: oos.dev/v1alpha1
kind: Entity
metadata: { name: Employee, namespace: hr }
spec:
  nature: entity
  primaryKey: [employeeId]
  properties:
    employeeId: { type: String }
    # `comp` está reservado: significaba compensación total antes de 0.3.0.
    comp:
      type: String
      description: Código de la compañía filial.
  reserved:
    - name: comp
      reason: >
        Antes de 0.3.0 significaba compensación total.
