apiVersion: oos.dev/v1alpha12
kind: Dataset
metadata:
  name: resumen
  namespace: hr
  description: "cuántos por país, lo escribió una sesión que leyó la tabla"
spec:
  owner: team:hr
  columns:
    pais: { type: String }
    n: { type: Integer }
  changes: { mode: upsert, key: [pais] }
  derivedFrom: [hr.employees]
