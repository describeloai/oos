apiVersion: oos.dev/v1alpha32
kind: Table
metadata: { name: competidores, namespace: ventas }
spec:
  datasource: erp
  object: 'public.competidores'
  columns:
    id: { physicalType: 'text', type: 'String' }
    nombre: { physicalType: 'text', type: 'String' }
    ventas: { physicalType: 'integer', type: 'Integer' }
    geom: { physicalType: 'geometry(Point,4326)', type: 'Geometry<Point, EPSG:4326>' }
  reads: { predicatePushdown: [eq], fullScan: cheap }
  changes: { mode: retract, witness: log }
