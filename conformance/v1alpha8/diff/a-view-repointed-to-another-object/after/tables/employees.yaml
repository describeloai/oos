apiVersion: oos.dev/v1alpha8
kind: Table
metadata: { name: employees, namespace: erp }
spec:
  datasource: erp
  object: "public.workers"
  columns:
    employee_id: { physicalType: "varchar(16)" }
    national_id: { physicalType: "varchar(16)" }
    country:     { physicalType: "char(2)" }
    deleted:     { physicalType: boolean }
  reads:
    predicatePushdown: [eq, in]
    fullScan: cheap
  changes: { mode: retract, witness: log }
