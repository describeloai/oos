apiVersion: oos.dev/v1alpha1
kind: Entity
metadata: { name: Factura, namespace: ventas }
spec:
  nature: entity
  primaryKey: [idFactura]
  properties:
    idFactura:  { type: Integer }
    nifCliente: { type: String }
  relations:
    cliente:
      target: ventas.Cliente
      cardinality: many_to_one
      via: [nifCliente]
      # Sin esto, el enlace se emparejaria contra `[id]` — un Integer contra un
      # String, o peor: verde si los tipos coincidieran por casualidad.
      toKey: [nif]
      required: true
