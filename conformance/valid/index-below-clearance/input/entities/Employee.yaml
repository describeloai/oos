apiVersion: oos.dev/v1alpha1
kind: Entity
metadata: { name: Employee, namespace: hr }
spec:
  nature: entity
  primaryKey: [employeeId]
  properties:
    employeeId: { type: String }
    departmentId:
      type: String
      labels: { gdpr.sensitivity: low }
  relations:
    department:
      target: hr.Department
      cardinality: many_to_one
      via: [departmentId]
