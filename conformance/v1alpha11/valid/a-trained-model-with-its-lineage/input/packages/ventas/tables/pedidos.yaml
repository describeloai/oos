apiVersion: oos.dev/v1alpha8
kind: Table
metadata: { name: pedidos, namespace: ventas }
spec:
  datasource: erp
  object: 'public.pedidos'
  columns:
    pedido_id: { physicalType: 'varchar(16)', type: String }
    fecha: { physicalType: 'date', type: Date }
    total: { physicalType: 'numeric(12,2)', type: Decimal }
  reads: { predicatePushdown: [eq], fullScan: cheap }
  changes: { mode: append, witness: snapshot }
