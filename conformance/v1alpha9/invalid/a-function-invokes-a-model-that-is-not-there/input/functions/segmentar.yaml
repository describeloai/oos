apiVersion: oos.dev/v1alpha9
kind: Function
metadata: { name: segmentar, namespace: ventas }
spec:
  runtime: model
  model: modelo/qwen
  prompt: "Clasifica la actividad de este cliente en un segmento de una palabra: pyme, corporativo, publico o particular. Contesta solo con la palabra."
  effects:
    - writes: ventas.Cliente.segmento
