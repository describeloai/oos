apiVersion: oos.dev/v1alpha2
kind: Function
metadata: { name: approvePurchaseOrder, namespace: scm }
spec:
  runtime: wasm
  entrypoint: dist/approve.wasm
  preconditions:
    - id: supplier-not-blocked
      expr: 'target.supplierScore < 80'
  effects:
    - writes: scm.PurchaseOrder.status
      datasourceRef: postgres_erp
  endorsements:
    - endorser: attested
      attestation: attestations/approve.intoto.jsonl
