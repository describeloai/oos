apiVersion: oos.dev/v1alpha18
kind: Function
metadata: { name: resumir, namespace: ventas }
spec:
  runtime: python
  entrypoint: analisis/funciones/resumir.py:resumir
  reads: [ventas.pedidos]
  models: [modelo/extractor]
  input:
    pais: { type: String, required: true }
  output:
    resumen: { type: String }
  limits: { timeout: 60s }
