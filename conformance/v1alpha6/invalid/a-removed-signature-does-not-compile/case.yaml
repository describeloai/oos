rule: spec/v1alpha6/02-firma.md#6.2
level: L0
expects: OOS2016
summary: >
  El lock afirma que este paquete lo firmo `oos.dev`, y el `.oob` del arbol no
  trae esa firma. Se para: quitar una firma no es lo mismo que no haberla
  tenido nunca, y sin esta comprobacion borrar el campo seria la forma barata
  de saltarse la anterior.
