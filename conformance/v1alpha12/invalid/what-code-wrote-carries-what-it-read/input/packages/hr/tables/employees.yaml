apiVersion: oos.dev/v1alpha8
kind: Table
metadata: { name: employees, namespace: hr }
spec:
  datasource: erp
  object: "public.employees"
  columns:
    employee_id: { physicalType: "varchar(16)", type: String }
    national_id: { physicalType: "varchar(16)", type: String }
    country:     { physicalType: "char(2)", type: String }
  reads:
    predicatePushdown: [eq, in]
    fullScan: cheap
  changes: { mode: retract, witness: log }
