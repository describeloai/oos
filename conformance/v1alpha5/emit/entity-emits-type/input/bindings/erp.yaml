apiVersion: oos.dev/v1alpha1
kind: Binding
metadata: { name: erp, namespace: hr }
spec:
  targetEntity: hr.Employee
  datasourceRef: hr_db
  source: "public.tb_employee"
  properties:
    employeeId: "emp_id"
    email:      "email"
    grade:      "grade"
    baseSalary: { column: "base_salary", physicalType: "numeric(18,2)" }
    managerId:  "manager_id"
