apiVersion: oos.dev/v1alpha1
kind: Entity
metadata: { name: PurchaseOrder, namespace: scm, labels: { oos.maturity: STABLE } }
spec:
  nature: entity
  primaryKey: [orderId]
  properties:
    orderId: { type: String }
    status:
      type: String
      labels: { acme.assurance: untrusted }
    total: { type: "Money<EUR, 2>" }
