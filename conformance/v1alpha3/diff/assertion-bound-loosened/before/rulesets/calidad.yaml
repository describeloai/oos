apiVersion: oos.dev/v1alpha3
kind: Ruleset
metadata: { name: calidad, namespace: eu }
spec:
  owner: team:compliance
  targets:
    - atLeast: { gdpr.sensitivity: high }
  assertions:
    - id: pocos-nulos
      metric: nullValues
      mustBeLessThan: 5
      dimension: completeness
      severity: error
