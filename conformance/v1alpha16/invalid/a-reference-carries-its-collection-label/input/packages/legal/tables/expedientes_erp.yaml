apiVersion: oos.dev/v1alpha8
kind: Table
metadata: { name: expedientes_erp, namespace: legal }
spec:
  datasource: erp
  object: "public.expedientes"
  columns:
    id: { physicalType: "varchar(16)", type: String }
    documento: { physicalType: "varchar(32)", type: String }
  reads: { predicatePushdown: [eq], fullScan: cheap }
  changes: { mode: retract, witness: log }
