apiVersion: oos.dev/v1alpha8
kind: Table
metadata: { name: pedidos, namespace: ventas }
spec:
  datasource: erp
  object: 'public.pedidos'
  columns:
    pedido_id: { physicalType: 'varchar(16)' }
    cliente_id: { physicalType: 'varchar(16)' }
    importe: { physicalType: 'numeric(12,2)' }
  reads: { predicatePushdown: [eq], fullScan: cheap }
  changes: { mode: append, witness: log }
